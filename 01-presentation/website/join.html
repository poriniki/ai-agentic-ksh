<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <title>Join · AI-Powered Professional</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='8' y='92' width='16' height='22' rx='4' fill='%234338ca'/%3E%3Crect x='30' y='74' width='16' height='40' rx='4' fill='%234338ca'/%3E%3Crect x='52' y='56' width='16' height='58' rx='4' fill='%234338ca'/%3E%3Crect x='74' y='38' width='16' height='76' rx='4' fill='%230d9488'/%3E%3Crect x='96' y='20' width='16' height='94' rx='4' fill='%230d9488'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">

<body class="phone">
  <header class="ph-top">
    <span id="ph-dot" class="ph-dot" aria-hidden="true"></span>
    <span id="ph-status">Connecting…</span>
  </header>

  <main class="ph-main">
    <div id="ph-offline" class="ph-card ph-warn" hidden>
      <p>Answers need the live session. Ask the presenter to start it, then reload this page.</p>
    </div>
    <section id="ph-slide" class="ph-slide" aria-live="polite"></section>
    <div id="ph-questions" class="ph-questions"></div>
    <details id="ph-text-wrap" class="ph-card ph-text">
      <summary>Read the slide text</summary>
      <div id="ph-text"></div>
    </details>
    <p id="ph-hint" class="ph-hint" role="status"></p>
  </main>

  <nav id="ph-reactions" class="ph-reactions" aria-label="Quick reactions"></nav>

  <script src="data/deck.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/audience.js"></script>
</body>
</html>
