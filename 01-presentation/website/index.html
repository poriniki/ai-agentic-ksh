<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The AI-Powered Professional</title>
  <meta name="description" content="Interactive workshop deck: practical AI for Marketing, Business and Finance teams, with live audience polls.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='8' y='92' width='16' height='22' rx='4' fill='%234338ca'/%3E%3Crect x='30' y='74' width='16' height='40' rx='4' fill='%234338ca'/%3E%3Crect x='52' y='56' width='16' height='58' rx='4' fill='%234338ca'/%3E%3Crect x='74' y='38' width='16' height='76' rx='4' fill='%230d9488'/%3E%3Crect x='96' y='20' width='16' height='94' rx='4' fill='%230d9488'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="deck-page">
  <main id="stage" class="stage"></main>

  <div id="progress" class="progress" aria-hidden="true"></div>
  <div id="conn" class="conn" role="status"></div>
  <p id="hint" class="nav-hint">← → move · O all slides · G go to · Q join QR · P presenter · ? keys</p>
  <button id="nav-prev" class="nav-btn nav-prev" type="button" aria-label="Previous slide">‹</button>
  <button id="nav-next" class="nav-btn nav-next" type="button" aria-label="Next slide">›</button>
  <div id="reactions" class="reactions" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="blackout" class="blackout" hidden>
    <p>Back soon</p>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-panel" role="dialog" aria-modal="true" aria-label="Deck panel">
      <button class="overlay-close" type="button" data-action="close" aria-label="Close">×</button>
      <div id="overlay-body"></div>
    </div>
  </div>

  <script src="data/deck.js"></script>
  <script src="assets/vendor/qrcode.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/layouts.js"></script>
  <script src="assets/js/deck.js"></script>
</body>
</html>
